---
# Deployment automation: apply manifests, roll out the new image, verify availability.
# Run by the pipeline:  ansible-playbook -i ansible/inventory ansible/deploy.yml -e image=<registry>/cicd-demo:<sha>
- name: Deploy cicd-demo to Kubernetes
  hosts: local
  gather_facts: false
  vars:
    image: ""
    app_name: cicd-demo
    k8s_dir: "{{ playbook_dir }}/../k8s"

  tasks:
    - name: Fail if no image was supplied
      ansible.builtin.assert:
        that: image | length > 0
        fail_msg: "Pass the image with -e image=<registry>/cicd-demo:<tag>"

    - name: Apply Kubernetes manifests
      ansible.builtin.command: kubectl apply -f {{ k8s_dir }}
      changed_when: true

    - name: Point the deployment at the new image
      ansible.builtin.command: kubectl set image deployment/{{ app_name }} app={{ image }}
      changed_when: true

    - name: Wait for rollout to finish
      ansible.builtin.command: kubectl rollout status deployment/{{ app_name }} --timeout=240s
      changed_when: false

    - name: Wait for the service to get an external IP
      ansible.builtin.command: >
        kubectl get service {{ app_name }}
        -o jsonpath={.status.loadBalancer.ingress[0].ip}
      register: svc_ip
      until: svc_ip.stdout | length > 0
      retries: 30
      delay: 10
      changed_when: false

    - name: Verify the application responds
      ansible.builtin.uri:
        url: "http://{{ svc_ip.stdout }}/actuator/health"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 12
      delay: 10

    - name: Show endpoint
      ansible.builtin.debug:
        msg: "Application is live at http://{{ svc_ip.stdout }}/"
